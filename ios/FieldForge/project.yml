# XcodeGen spec for FieldForge.
#
#   brew install xcodegen
#   xcodegen generate
#   open FieldForge.xcodeproj
#
# Everything below is plain build settings — if you would rather not use
# XcodeGen, create an iOS App target named "FieldForge" in Xcode, drag the
# FieldForge/ folder in as a folder reference, and copy the settings from here.
name: FieldForge
options:
  bundleIdPrefix: org.rexautistikonlabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: 964M77TDXU
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    OTHER_SWIFT_FLAGS: "$(inherited)"

packages:
  StripeTerminal:
    url: https://github.com/stripe/stripe-terminal-ios
    from: 5.0.0

targets:
  FieldForge:
    type: application
    platform: iOS
    sources:
      - path: FieldForge
        excludes:
          - "**/*.md"
          # These three live inside the source tree for tidiness but must never
          # be copied into the bundle:
          #   * Info.plist as a resource collides with the generated one
          #     ("Multiple commands produce Info.plist") and fails the build.
          #   * shipping the entitlements file inside the app is a needless
          #     disclosure of the app's capabilities.
          #   * the StoreKit config is a debug-only testing artefact; the scheme
          #     references it by path, which does not require bundling.
          - "App/Info.plist"
          - "App/FieldForge.entitlements"
          - "Monetization/Products.storekit"
          - "**/*.h"
    settings:
      base:
        PRODUCT_NAME: FieldForge
        PRODUCT_BUNDLE_IDENTIFIER: org.rexautistikonlabs.fieldforge
        INFOPLIST_FILE: FieldForge/App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: FieldForge/App/FieldForge.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 964M77TDXU
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_OBJC_BRIDGING_HEADER: FieldForge/Services/SharedWarmth/CloudKitExceptionCatcher.h
        CLANG_ENABLE_OBJC_ARC: YES
        # Tap to Pay is a managed development entitlement. Declare
        # com.apple.developer.proximity-reader.payment.acceptance in the
        # entitlements file / entitlements.properties — do not add it via
        # Xcode + Capability (unavailable for this target). Runtime still
        # skips Terminal Tap to Pay APIs if the signed profile lacks the key.
    # Do not use XcodeGen `info:` — it overwrites the hand-written Info.plist.
    # Entitlements properties must be listed here so `xcodegen generate` keeps
    # Apple Pay instead of writing an empty entitlements file.
    # Tap to Pay is declared as a raw key, not via the capability library.
    entitlements:
      path: FieldForge/App/FieldForge.entitlements
      properties:
        com.apple.developer.in-app-payments:
          - merchant.org.rexautistikonlabs.fieldforge
        com.apple.developer.proximity-reader.payment.acceptance: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.org.rexautistikonlabs.fieldforge
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    dependencies:
      - sdk: PassKit.framework
      - sdk: PDFKit.framework
      - sdk: MapKit.framework
      - sdk: Vision.framework
      - sdk: VisionKit.framework
      - sdk: Speech.framework
      - sdk: Contacts.framework
      - sdk: ContactsUI.framework
      - sdk: StoreKit.framework
      - sdk: MessageUI.framework
      - sdk: CoreLocation.framework
      - sdk: UserNotifications.framework
      - sdk: AVFoundation.framework
      - sdk: CloudKit.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: ProximityReader.framework
        weak: true
      - sdk: Security.framework
      - sdk: AuthenticationServices.framework
      - package: StripeTerminal
        product: StripeTerminal

  FieldForgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FieldForgeTests
    dependencies:
      - target: FieldForge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.rexautistikonlabs.fieldforge.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 964M77TDXU

schemes:
  FieldForge:
    build:
      targets:
        FieldForge: all
    run:
      config: Debug
      storeKitConfigurationFileReference: FieldForge/Monetization/Products.storekit
    test:
      config: Debug
      targets:
        - FieldForgeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
