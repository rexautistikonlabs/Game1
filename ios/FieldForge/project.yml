# XcodeGen spec for FieldForge.
#
#   brew install xcodegen
#   xcodegen generate
#   open FieldForge.xcodeproj
#
# Everything below is plain build settings — if you would rather not use
# XcodeGen, create an iOS App target named "FieldForge" in Xcode, drag the
# FieldForge/ folder in as a folder reference, and copy the settings from here.
name: FieldForge
options:
  bundleIdPrefix: org.example.fieldforge
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: "" # <- your Apple Developer Team ID
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    OTHER_SWIFT_FLAGS: "$(inherited)"

targets:
  FieldForge:
    type: application
    platform: iOS
    sources:
      - path: FieldForge
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_NAME: FieldForge
        PRODUCT_BUNDLE_IDENTIFIER: org.example.fieldforge
        INFOPLIST_FILE: FieldForge/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: FieldForge/App/FieldForge.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: ""
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # Tap to Pay on iPhone needs the com.apple.developer.proximity-reader.payment.acceptance
        # entitlement from Apple plus a payment-platform SDK. Until that is granted the
        # ProximityReader code path compiles but reports .needsEntitlement at runtime.
    info:
      path: FieldForge/App/Info.plist
    entitlements:
      path: FieldForge/App/FieldForge.entitlements
    dependencies:
      - sdk: PassKit.framework
      - sdk: PDFKit.framework
      - sdk: MapKit.framework
      - sdk: Vision.framework
      - sdk: VisionKit.framework
      - sdk: Speech.framework
      - sdk: Contacts.framework
      - sdk: ContactsUI.framework
      - sdk: StoreKit.framework
      - sdk: MessageUI.framework
      - sdk: CoreLocation.framework
      - sdk: UserNotifications.framework
      - sdk: AVFoundation.framework
      - sdk: CloudKit.framework
      - sdk: ProximityReader.framework
        weak: true

  FieldForgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FieldForgeTests
    dependencies:
      - target: FieldForge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.fieldforge.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FieldForge:
    build:
      targets:
        FieldForge: all
    run:
      config: Debug
      storeKitConfigurationFileReference: FieldForge/Monetization/Products.storekit
    test:
      config: Debug
      targets:
        - FieldForgeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
